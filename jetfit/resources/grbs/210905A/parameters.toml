# MCMC Parameter Configuriation File

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = 1.0
    upper = 4.0

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "rho0"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 6.0
    initial_guess = -5.0
    initial_sigma = 1.00

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -3.5
    upper = 0.0
    initial_guess = -1.63
    initial_sigma = 0.5

#-------------- MODEL --------------
#-------------- eps_b --------------
[[model]]
name  = "eps_b"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0
    initial_guess = -5.5
    initial_sigma = 0.50

#-------------- MODEL --------------
#---------------- p ----------------
[[model]]
name  = "p"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 3.0
    initial_guess = 2.35
    initial_sigma = 0.10

#-------------- MODEL --------------
#---------------- k ----------------
[[model]]
name  = "k"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = -10.0
    upper = 1.0
    initial_guess = -8.0
    initial_sigma = 1.0

#-------------- MODEL --------------
#---------------- X ----------------
[[model]]
name  = "X"
scale = "linear"
value = 0.7

#-------------- MODEL --------------
#---------------- z ----------------
[[model]]
name  = "z"
