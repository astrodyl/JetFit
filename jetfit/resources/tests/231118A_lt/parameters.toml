# Boosted Fireball Model Parameters

# ==========================
#  HYDRODYNAMIC PARAMETERS
# ==========================
[explosion_energy]
    scale = "log"

    [explosion_energy.prior]
        type  = "uniform"
        lower = -10.0
        upper = 3.0

[circumburst_density]
    scale = "log"

    [circumburst_density.prior]
        type  = "uniform"
        lower = -5.0
        upper = 5.0

[asymptotic_lorentz_factor]
    scale = "linear"

    [asymptotic_lorentz_factor.prior]
        type  = "uniform"
        lower = 2.0
        upper = 15.0

[boost_lorentz_factor]
    scale = "linear"

    [boost_lorentz_factor.prior]
        type  = "uniform"
        lower = 1.0
        upper = 20.0

# ==========================
#    RADIATION PARAMETERS
# ==========================
[electron_energy_fraction]
    scale = "log"

    [electron_energy_fraction.prior]
        type  = "uniform"
        lower = -10.0
        upper = 0.0

[magnetic_energy_fraction]
    scale = "log"

    [magnetic_energy_fraction.prior]
        type  = "uniform"
        lower = -10.0
        upper = 0.0

[electron_energy_index]
    scale = "linear"

    [electron_energy_index.prior]
        type  = "uniform"
        lower = 2.0
        upper = 5.0

[accelerated_electron_fraction]
    scale = "linear"
    value = 1.0

# ==========================
#  OBSERVATIONAL PARAMETERS
# ==========================
[obs_angle]
    scale = "linear"

    [obs_angle.prior]
        type  = "sine"
        lower = 0.0
        upper = 1.0

[redshift]
    scale = "linear"
    value = 0.8304

[luminosity_distance]
    scale = "linear"
    value = 1.67

[ebv_milky_way]
    scale = "linear"
    value = 0.0955

[ebv_source_frame]
    scale = "linear"

    [ebv_source_frame.prior]
        type  = "uniform"
        lower = 0.0
        upper = 1.0

