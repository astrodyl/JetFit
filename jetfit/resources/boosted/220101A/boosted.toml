# MCMC Parameter Configuriation File

#-------------- MODEL --------------
#---------------- E ----------------
[[model]]
name  = "E"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -4.0
    upper = 2.0

#-------------- MODEL --------------
#---------------- n ----------------
[[model]]
name  = "n0"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 6.0

#-------------- MODEL --------------
#-------------- eta --------------
[[model]]
name  = "eta"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 15.0

#-------------- MODEL --------------
#-------------- gamma_b --------------
[[model]]
name  = "gamma_b"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 1.0
    upper = 20.0

#-------------- MODEL --------------
#-------------- theta_obs --------------
[[model]]
name  = "theta_obs"
scale = "linear"

[model.prior]
    type  = "sine"
    lower = 0.0
    upper = 1.0

#-------------- MODEL --------------
#-------------- eps_e --------------
[[model]]
name  = "eps_e"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0

#-------------- MODEL --------------
#-------------- eps_b --------------
[[model]]
name  = "eps_b"
scale = "log"

[model.prior]
    type  = "uniform"
    lower = -6.0
    upper = 0.0

#-------------- MODEL --------------
#---------------- p ----------------
[[model]]
name  = "p"
scale = "linear"

[model.prior]
    type  = "uniform"
    lower = 2.0
    upper = 3.0
    initial_guess = 2.25
    initial_sigma = 0.25

#-------------- MODEL --------------
#---------------- z ----------------
[[model]]
name  = "z"
scale = "linear"
value = 4.61

#-------------- MODEL --------------
#---------------- dL ---------------
[[model]]
name  = "dL28"
scale = "linear"
value = 13.39

#-------------- MODEL --------------
#---------------- zeta ---------------
[[model]]
name  = "zeta"
scale = "linear"
value = 1.0

